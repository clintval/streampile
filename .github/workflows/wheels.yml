name: wheels

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: 0.12.20

jobs:
  build-wheels:
    name: build-wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        # pysam publishes no Windows wheels, so neither does streampile.
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64, manylinux: "" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
          sccache: "false"

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streampile-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-wheels:
    name: verify-wheels (${{ matrix.platform.name }}, ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.platform.runner }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, alpine: false }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, alpine: false }
          - { name: musllinux-x86_64, runner: ubuntu-latest, alpine: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
          - { name: macos-x86_64, runner: macos-15-intel, alpine: false }
          - { name: macos-arm64, runner: macos-15, alpine: false }
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streampile-wheel-${{ matrix.platform.name }}
          path: dist/

      - name: Write the smoke test
        shell: bash
        run: |
          cat > smoke.py <<'PY'
          import importlib
          import pkgutil

          import pysam

          import streampile
          from streampile import StreamingPileupBuilder
          from streampile._native import direct_bridge

          for module in pkgutil.walk_packages(streampile.__path__, "streampile."):
              importlib.import_module(module.name)

          header = {"HD": {"VN": "1.6", "SO": "coordinate"}, "SQ": [{"SN": "chr1", "LN": 100}]}
          with pysam.AlignmentFile("smoke.bam", "wb", header=header) as sink:
              read = pysam.AlignedSegment(sink.header)
              read.query_name = "r"
              read.reference_id = 0
              read.reference_start = 10
              read.mapping_quality = 60
              read.cigarstring = "2M1D2M"
              read.query_sequence = "ACGT"
              read.query_qualities = pysam.qualitystring_to_array("IIII")
              sink.write(read)
          with pysam.AlignmentFile("smoke.bam") as reads, StreamingPileupBuilder(reads) as builder:
              depths = [pileup.unfiltered_depth for pileup in builder.columns("chr1", 9, 16)]
          assert direct_bridge(), "pysam records are read through their attributes"
          assert depths == [0, 1, 1, 1, 1, 1, 0], depths
          print("streampile", "works")
          PY

      - name: Install uv
        if: ${{ !matrix.platform.alpine }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Install the wheel and run the smoke test
        if: ${{ !matrix.platform.alpine }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv dist/*.whl
          uv run --no-project --python .venv python -P smoke.py

      - name: Install the wheel and run the smoke test on Alpine
        if: ${{ matrix.platform.alpine }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work "python:${PYTHON_VERSION}-alpine" \
            sh -c 'pip install --root-user-action=ignore dist/*.whl && python -P smoke.py'
