name: wheels

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: 0.12.20

jobs:
  build-wheels:
    name: build-wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        # pysam publishes no Windows wheels, so neither does streampile.
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64, manylinux: "" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
          sccache: "false"

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streampile-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-wheels:
    name: verify-wheels (${{ matrix.platform.name }}, ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read  # to check out the smoke test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, alpine: false }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, alpine: false }
          - { name: musllinux-x86_64, runner: ubuntu-latest, alpine: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
          - { name: macos-x86_64, runner: macos-15-intel, alpine: false }
          - { name: macos-arm64, runner: macos-15, alpine: false }
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streampile-wheel-${{ matrix.platform.name }}
          path: dist/

      - name: Check out the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/smoke.py
          sparse-checkout-cone-mode: false
          path: repository

      - name: Copy out the smoke test
        shell: bash
        run: cp repository/.github/smoke.py smoke.py

      - name: Install uv
        if: ${{ !matrix.platform.alpine }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Install the wheel and run the smoke test
        if: ${{ !matrix.platform.alpine }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv dist/*.whl
          uv run --no-project --python .venv python -P smoke.py

      - name: Install the wheel and run the smoke test on Alpine
        if: ${{ matrix.platform.alpine }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work "python:${PYTHON_VERSION}-alpine" \
            sh -c 'pip install --root-user-action=ignore dist/*.whl && python -P smoke.py'

  build-sdist:
    name: build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: "false"

      - name: Build the source distribution
        run: uv build --sdist

      - name: Print the contents of the source distribution
        run: tar -tzf dist/*.tar.gz

      - name: Upload the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streampile-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-sdist:
    name: verify-sdist (${{ matrix.python-version }})
    needs: build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the smoke test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streampile-sdist
          path: dist/

      - name: Check out the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/smoke.py
          sparse-checkout-cone-mode: false
          path: repository

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Build and install the source distribution and run the smoke test
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          cp repository/.github/smoke.py smoke.py
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv dist/*.tar.gz
          uv run --no-project --python .venv python -P smoke.py
