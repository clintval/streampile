[package]
name = "streampile"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
license = "MIT"
description = "Forward-only pileups streamed from coordinate-sorted BAM records"
repository = "https://github.com/clintval/streampile"
documentation = "https://docs.rs/streampile"
readme = "README.md"
categories = ["science::bioinformatics"]
keywords = ["bioinformatics", "pileup", "bam", "genomics", "sequencing"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/examples/**/*.rs",
    "/src/**/*.rs",
    "/tests/data/reads.bam",
]

[lib]
name = "streampile"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
bstr = "1.12"
noodles = { version = "0.115.0", features = ["bam", "bgzf", "core", "sam"] }
noodles-bgzf = { version = "0.51.0", features = ["libdeflate"] }
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
